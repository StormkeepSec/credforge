# credforge production stack.
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
#   docker compose exec app node dist/cli.js create-platform-admin --email you@example.org
# The app listens on 127.0.0.1:3000 only; put your nginx (TLS) in front of it.

name: credforge

# Container logs are rotated (Docker keeps them forever otherwise): at most 5 × 10 MB each.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  logging: *logging
  image: credforge:${CREDFORGE_VERSION:-latest} # a registry path once CI publishes images
  build: .
  env_file: .env
  environment: &app-env
    # The app and worker connect as a restricted role (created by migrate): no DDL, and the
    # audit log is read and append only.
    DATABASE_URL: postgres://credforge_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}@db:5432/credforge
  restart: unless-stopped

services:
  migrate:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    restart: "no"
    environment:
      <<: *app-env
      # Migrations run as the database owner.
      MIGRATION_DATABASE_URL: postgres://credforge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/credforge
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    ports:
      - "127.0.0.1:${CREDFORGE_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads # only used with STORAGE_DRIVER=local
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  worker:
    <<: *app
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    volumes:
      - uploads:/data/uploads # only used with STORAGE_DRIVER=local
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Nightly database backups (deploy/backup.sh, deploy/restore.sh). Not a long-running service:
  # the scripts run it with `docker compose run`. Its bucket key lives in backup.env, which only
  # this service reads, so the app and worker never hold it.
  backup:
    <<: *app
    profiles: ["backup"]
    command: ["node", "dist/backup.js", "help"]
    restart: "no"
    env_file:
      - path: .env
      - path: backup.env
        required: false
    environment: {}

  db:
    image: postgres:18-alpine
    logging: *logging
    environment:
      POSTGRES_DB: credforge
      POSTGRES_USER: credforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql # PostgreSQL 18 images expect this mount point
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credforge -d credforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata: {}
  uploads: {}
